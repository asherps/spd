# MNIST Memorization SPD Config
# --- WandB ---
wandb_project: spd-mnist
wandb_run_name: null
wandb_run_name_prefix: "newconfig"

# --- General ---
seed: 0
n_mask_samples: 1
ci_fn_type: "shared_mlp" # shared MLP for all CIs in a layer
ci_fn_hidden_dims: [128]
sigmoid_type: "leaky_hard"
module_info:
  - module_pattern: "fc1"  # First linear layer
    C: 1000  # Number of components (more than needed to find sparse solution)
  - module_pattern: "fc2"  # Second linear layer
    C: 1000
use_delta_component: true # difference between true parameters and subcomponents — *always* has CI 0

loss_metric_configs:
  - classname: "FaithfulnessLoss"
    coeff: 5 #1-10ish
  - classname: "ImportanceMinimalityLoss" # coeff here needs tuning often
    coeff: 1e-4  # Start with small coefficient for memorization
    pnorm: 2.0 # anneal pnorm over training
    p_anneal_start_frac: 0
    p_anneal_final_p: 0.5 # final value
    p_anneal_end_frac: 1 # at what point in training do you stop annealing
  - classname: "StochasticReconSubsetLoss" # Replaced StochasticReconLoss with StochasticReconSubsetLoss
  # uniformly sample from power set of layers --> uniformly sample masks for ALL components in layer
    coeff: 0.5
  - classname: "PGDReconSubsetLoss" # Replaced PGDReconLayerwiseLoss with PGDReconSubsetLoss
    coeff: 0.5
    init: random
    step_size: 1.0 # n_steps steps of size step_size in the direction of the gradient
    n_steps: 1.0 # one test-time gradient step adversarially optimizing the masks
    mask_scope: shared_across_batch
  - classname: "ComponentWeightSparsityLoss"  # Encourage sparse component weights
    coeff: 1e-5  # Small penalty on component parameter magnitudes
    pnorm: 1.0  # L1 for sparsity
output_loss_type: kl

# --- Training ---
batch_size: 256
eval_batch_size: 512
steps: 20_000
lr_schedule:
  start_val: 1e-3
  fn_type: cosine
  warmup_pct: 0.1
  final_val_frac: 0.0

# --- Faithfulness Warmup ---
faithfulness_warmup_steps: 500
faithfulness_warmup_lr: 0.01
faithfulness_warmup_weight_decay: 0.1

# --- Logging & Saving ---
train_log_freq: 100
eval_freq: 500
n_eval_steps: 50
slow_eval_freq: 2_000
save_freq: 5_000
ci_alive_threshold: 0.1
n_examples_until_dead: 1_000_000
eval_metric_configs:
  - classname: "CIHistograms"
    n_batches_accum: 10
  - classname: "ComponentActivationDensity"
  - classname: "CI_L0"
    groups: null
  - classname: "CIMeanPerComponent"
  - classname: "UnmaskedReconLoss"  # Deterministic loss (no stochastic masking)
  - classname: "PGDReconLoss"  # FULLY Adversarial output reconstruction: 
    # important eval faithfulness metric
    init: random
    step_size: 0.1
    n_steps: 20
    mask_scope: shared_across_batch
  - classname: "PGDReconLayerwiseLoss"  # Adversarial layerwise reconstruction
    init: random
    step_size: 0.1
    n_steps: 10
    mask_scope: shared_across_batch

# --- Pretrained model info ---
# Update this path after training your MNIST model
pretrained_model_class: "spd.experiments.mnist.models.MNISTMemorizationModel"
pretrained_model_path: "/root/spd_out/mnist/target_model.pt"

# --- Task Specific ---
task_config:
  task_name: mnist
  shuffled_labels_path: "/root/spd_out/mnist/shuffled_labels_seed42.pkl"
